name: .NET 10 integration and migration parity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Repository/Examples.slnx
      - name: Run integration and Ardalis parity tests
        run: dotnet test Repository/Examples.slnx --configuration Release --no-restore
